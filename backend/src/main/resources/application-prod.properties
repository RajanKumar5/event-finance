spring.application.name=event-finance-backend

server.port=8080
server.address=127.0.0.1

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/event_finance}
spring.datasource.username=${DB_USERNAME:eventfinance}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# =========================
# Bootstrap Administrator
# =========================

app.bootstrap-admin.username=${INITIAL_ADMIN_USERNAME:admin}
app.bootstrap-admin.password=${INITIAL_ADMIN_PASSWORD:}
app.bootstrap-admin.display-name=${INITIAL_ADMIN_DISPLAY_NAME:Administrator}