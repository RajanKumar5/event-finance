spring.application.name=event-finance-backend

spring.datasource.url=jdbc:mysql://localhost:3306/event_finance
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =========================
# Bootstrap Administrator
# =========================

app.bootstrap-admin.username=${APP_ADMIN_USERNAME:admin}
app.bootstrap-admin.password=${APP_ADMIN_PASSWORD}
app.bootstrap-admin.display-name=${APP_ADMIN_DISPLAY_NAME:Administrator}